version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Majors stay out of the groups and arrive as their own PRs, so one
      # breaking update cannot hold back the patches it was bundled with.
      npm-production:
        dependency-type: production
        update-types: ['minor', 'patch']
      npm-development:
        dependency-type: development
        update-types: ['minor', 'patch']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
